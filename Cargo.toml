[package]
name = "tjpgd-rs"
version = "0.1.0"
edition = "2021"
description = "A no_std compatible Rust translation of the TJpgDec library."
license = "MIT"
repository = "https://github.com/decaday/tjpgd-rs"
categories = ["embedded", "multimedia::images", "no-std"]
keywords = ["jpeg", "decoder", "embedded", "no_std"]

[features]
default = []
alloc = []

[dependencies]
embedded-io = { version = "0.7.1", default-features = false }
bytemuck = { version = "1.16", default-features = false }
